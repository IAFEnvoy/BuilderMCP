[package]
name = "buildermcp"
version = "0.1.0"
description = "Minecraft building editor with a local MCP server"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buildermcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
base64 = "0.22"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
sha1 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
