name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  version:
    name: Read Cargo version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cargo.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package version
        id: cargo
        shell: bash
        run: |
          version=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "buildermcp") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish executables
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-build-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          tag_ref="refs/tags/$tag"
          if git show-ref --verify --quiet "$tag_ref" && [[ "$(git rev-parse "$tag_ref^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to a different commit."
            exit 1
          fi

          assets=(
            artifacts/buildermcp-x86_64-pc-windows-msvc.exe
            artifacts/buildermcp-x86_64-apple-darwin.tar.gz
            artifacts/buildermcp-aarch64-apple-darwin.tar.gz
            artifacts/buildermcp-x86_64-unknown-linux-gnu.tar.gz
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing executable asset $asset."
              exit 1
            fi
          done

          flags=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "Builder MCP $tag" --generate-notes "${flags[@]}"
